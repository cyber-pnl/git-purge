version: 2

project_name: git-purge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/git-purge
    binary: git-purge
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/cyber-pnl/git-purge/internal/cli.Version=v{{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
